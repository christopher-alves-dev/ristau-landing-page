steps:
  eyebrow: Como encomendar
  title: Receba em casa a sua case kindle
  items:
    - title: Peça pelo WhatsApp
      text: >-
        Por se tratar de um produto personalizado e feito para você, o
        atendimento é individualizado e pelo WhatsApp. Clique no balão abaixo
        para falar comigo.
    - title: Escolha a cor
      text: >-
        Nossa cartela tem mais de 70 cores, escolha a que mais combina com
        você. 
    - title: Itens adicionais
      text: >-
        Adicione a inicial do seu nome, alça de mão, chaveiro tassel, laço com
        ponteira, vamos deixar ela com seu estilo.
  cta: Pedir a minha pelo WhatsApp
  ctaMessage: Olá! Quero encomendar uma capa de Kindle personalizada.
testimonials:
